[project]
name = "ragify-python"
version = "0.1.0"
description = "Python & FastAPI based backend for ragify"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "cors>=1.0.1",
    "fastapi[standard]>=0.141.1",
    # "granian[uvloop]>=2.8.2",
    "google-auth>=2.30.0",
    "grpcio>=1.83.0",
    "grpcio-tools>=1.83.0",
    "protobuf>=5.0.0",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.2",
    # google-auth fetches the Cloud Run ID token that authenticates calls to
    # ragify-rag, and its metadata transport needs requests.
    "requests>=2.32.0",
    "sqlalchemy>=2.0.52",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "httpx2>=2.12.0","opentelemetry-api>=1.44.0",
    "opentelemetry-exporter-otlp>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-redis>=0.65b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0",
    "opentelemetry-sdk>=1.44.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
]
